name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencias del modelo (opcional, habilita boosting)
        run: pip install -r backend/requirements-modelo.txt
      - name: Pipeline + motor
        run: python backend/predicta.py ingesta
      - name: Pruebas de aceptación
        run: python backend/pruebas.py
      - name: Ensamblar _site
        run: bash deploy/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
